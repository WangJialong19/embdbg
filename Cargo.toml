[workspace]
resolver = "3"
members = ["crates/embdbg-core", "crates/embdbg-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
embdbg-core = { path = "crates/embdbg-core" }

# egui has no 1.0 and ships breaking changes every 2–3 months.
# Pin exactly and upgrade as a deliberate, separate step.
egui = "=0.37.0"
egui_extras = "=0.37.0"
# Both renderers are compiled in (the default wgpu plus glow), so the user, or the
# startup fallback, can pick one at runtime.
eframe = { version = "=0.37.0", features = ["glow"] }
egui_dock = { version = "=0.22.0", features = ["serde"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "sync",
    "time",
    "fs",
] }
parking_lot = "0.12"
serialport = "4.10"
realfft = "3.5"
vt100 = "0.18"
# Text encodings for consoles that are not UTF-8; GBK devices are common.
encoding_rs = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.11.0", features = ["transport-io", "transport-async-rw"] }
interprocess = { version = "2.4.9", features = ["tokio"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rumqttc = { version = "0.25", default-features = false }
tokio-modbus = { version = "0.17", features = ["tcp", "rtu"] }
tokio-serial = "5"
# Decoder plugins run in a pure-Rust WASM interpreter: no JIT, small, and easy to meter.
wasmi = "1.1"
toml = "0.8"
# Native open-file and open-folder dialogs for installing plugins.
rfd = "0.15"
